# Everything in one command:   docker compose up --build
# Copy .env.example to .env first (set JWT_ACCESS_SECRET and your Paystack TEST key).
# DATABASE_URL is overridden below so the API talks to the postgres container.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      PORT: '3000'
    command: sh -c "node dist/database/migrate.js && node dist/main.js"
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
